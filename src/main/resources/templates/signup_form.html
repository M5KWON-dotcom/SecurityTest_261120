<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <link rel="stylesheet" th:href="@{/css/signup.css}">
</head>
<body>
<div class="signup-container">
    <h1>회원가입</h1>

    <form th:action="@{/user/signup}" th:object="${signupForm}" method="post" novalidate>
        <!-- 폼 전체(글로벌) 에러 메시지 출력 -->
        <div class="error-banner" th:if="${#fields.hasGlobalErrors()}">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
        </div>

        <!-- 1. 아이디 -->
        <div class="form-group">
            <label for="username">아이디</label>
            <input type="text"
                   id="username"
                   th:field="*{username}"
                   th:classappend="${#fields.hasErrors('username')} ? 'input-error' : ''"
                   placeholder="아이디를 입력하세요">
            <p class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
        </div>

        <!-- 2. 비밀번호 -->
        <div class="form-group">
            <label for="password1">비밀번호</label>
            <input type="password"
                   id="password1"
                   th:field="*{password1}"
                   th:classappend="${#fields.hasErrors('password1')} ? 'input-error' : ''"
                   placeholder="비밀번호를 입력하세요">
            <p class="field-error" th:if="${#fields.hasErrors('password1')}" th:errors="*{password1}"></p>
        </div>

        <!-- 3. 비밀번호 확인 -->
        <div class="form-group">
            <label for="password2">비밀번호 확인</label>
            <input type="password"
                   id="password2"
                   th:field="*{password2}"
                   th:classappend="${#fields.hasErrors('password2')} ? 'input-error' : ''"
                   placeholder="비밀번호를 다시 입력하세요">
            <p class="field-error" th:if="${#fields.hasErrors('password2')}" th:errors="*{password2}"></p>
        </div>

        <!-- 4. 이메일 -->
        <div class="form-group">
            <label for="email">이메일</label>
            <input type="email"
                   id="email"
                   th:field="*{email}"
                   th:classappend="${#fields.hasErrors('email')} ? 'input-error' : ''"
                   placeholder="name@example.com">
            <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        </div>

        <button type="submit" class="btn-submit">가입하기</button>
    </form>
</div>
</body>
</html>
